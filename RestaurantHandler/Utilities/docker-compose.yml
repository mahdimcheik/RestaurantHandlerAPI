services:
  db:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: container-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - local-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: container-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-root}
    ports:
      - "127.0.0.1:5050:80" # Accessible via localhost:5050
    depends_on:
      db:
        condition: service_healthy
    networks:
      - local-network
      - global-network

  api:
    image: mahdimcheik/bonprof:latest
    container_name: container-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      JWT_KEY: ${JWT_KEY}
      ADDRESS_ENCRYPTION_KEY: ${ADDRESS_ENCRYPTION_KEY}
      API_BACK_URL: ${API_BACK_URL}
      API_FRONT_URL: ${API_FRONT_URL}
      DB_PORT: ${DB_PORT}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIES_VALIDITY_DAYS: ${COOKIES_VALIDITY_DAYS}
      TOKEN_VALIDITY_MINUTES: ${TOKEN_VALIDITY_MINUTES}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_LOGIN: ${SMTP_LOGIN}
      SMTP_KEY: ${SMTP_KEY}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_ALLOW_SELF_SIGNED: ${SMTP_ALLOW_SELF_SIGNED:-false}
      DO_NO_REPLY_MAIL: ${DO_NO_REPLY_MAIL}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED}
      S3_UPLOAD_URL: ${S3_UPLOAD_URL}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      SIGNED_URL_MINUTES: ${SIGNED_URL_MINUTES:-60}
      PRIVACY_DOCUMENT_RETENTION_DAYS: ${PRIVACY_DOCUMENT_RETENTION_DAYS:-30}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@bonprof.fr}
      RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
      RATE_LIMIT_IP_PER_MINUTE: ${RATE_LIMIT_IP_PER_MINUTE:-300}
      RATE_LIMIT_USER_PER_MINUTE: ${RATE_LIMIT_USER_PER_MINUTE:-200}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_EXEMPT_IPS: ${RATE_LIMIT_EXEMPT_IPS:-}

    expose:
      - 7113
    networks:
      - local-network
      - global-network
    depends_on:
      db:
        condition: service_healthy

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    restart: always
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    networks:
      - local-network

volumes:
  postgres_data:

networks:
  local-network:
    driver: bridge
  global-network:
    external: true

# Pile de PRODUCTION sur Acer, dans ~/restauranthandler/back-end, à côté d'un .env
# construit à partir de .env.deploy.example (cp .env.deploy.example .env && vi .env).
# Le workflow CI-CD réécrit la ligne IMAGE_TAG= du .env avant chaque `docker compose up`.
#
# Trafic : Nginx Proxy Manager → conteneur front (nginx) → /api, /hubs, /hangfire → api:8080.
# L'API ne publie aucun port ; le front la joint par global-network sous le nom
# container-restauranthandler-api.
name: restauranthandler

services:
  db:
    image: postgres:17
    container_name: container-restauranthandler-db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Local uniquement (tunnel SSH pour un client SQL). 5431 est pris sur Acer.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - local-network

  api:
    image: mahdimcheik/restauranthandler:${IMAGE_TAG:-latest}
    container_name: container-restauranthandler-api
    restart: unless-stopped
    # Toutes les variables de l'API viennent du .env (modèle : .env.deploy.example).
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
    expose:
      - 8080
    # Fichiers envoyés en STORAGE_PROVIDER=local (photos de la carte, avatars) : à sauvegarder.
    volumes:
      - uploads:/app/wwwroot/uploads
    networks:
      - local-network
      - global-network
    depends_on:
      db:
        condition: service_healthy

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    container_name: container-restauranthandler-pgbackups
    restart: always
    volumes:
      - ./backups:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    networks:
      - local-network
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:

networks:
  local-network:
    driver: bridge
  global-network:
    external: true

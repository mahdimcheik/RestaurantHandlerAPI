name: CI-CD

on:
  push:
    tags:
      - "v*" # se déclenche sur git tag v1.4.0, v1.4.1, etc.
      - "!v*-rc*" # les tags de pré-production partent sur CD-TEST
      - "!v*-test*"

# Un seul déploiement prod à la fois : deux tags poussés ensemble ne se doublent plus.
concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build the Docker image
        run: |
          docker build . --file RestaurantHandler/Dockerfile \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            --tag mahdimcheik/restauranthandler:${{ steps.version.outputs.version }} \
            --tag mahdimcheik/restauranthandler:latest

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push image to Docker Hub
        run: docker push --all-tags mahdimcheik/restauranthandler

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          # Le compose prod tire mahdimcheik/restauranthandler:${IMAGE_TAG:-latest} : on fige le tag
          # dans le .env plutôt que de dépendre de :latest (écrasé par le dernier run fini).
          script: |
            set -e
            cd ~/restauranthandler/back-end
            touch .env
            grep -v '^IMAGE_TAG=' .env > .env.tmp || true
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env.tmp
            mv .env.tmp .env
            docker pull mahdimcheik/restauranthandler:${IMAGE_TAG}
            docker compose up -d --force-recreate api
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}

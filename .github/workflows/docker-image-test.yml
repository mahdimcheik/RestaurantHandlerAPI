name: CD-TEST

on:
  push:
    tags:
      - "test-version-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version affichée (vide = test-<SHA court>)"
        required: false

# Un seul déploiement de test à la fois
concurrency:
  group: cd-test
  cancel-in-progress: false

env:
  API_URL: https://test-api.bonprof.fr

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    # Environnement GitHub « test » : porte les secrets TEST_VPS_* du serveur de test.
    environment:
      name: test
      url: https://test-api.bonprof.fr/version

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.version }}"
            version="${version:-test-${GITHUB_SHA::7}}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Jamais le tag :latest, réservé à la prod (docker-compose.yml de prod).
      - name: Build the Docker image
        run: |
          docker build . --file RestaurantHandler/Dockerfile \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            --tag mahdimcheik/restauranthandler:${{ steps.version.outputs.version }} \
            --tag mahdimcheik/restauranthandler:test

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push image to Docker Hub
        run: |
          docker push mahdimcheik/restauranthandler:${{ steps.version.outputs.version }}
          docker push mahdimcheik/restauranthandler:test

      # Serveur de test DÉDIÉ : secrets TEST_VPS_*, jamais VPS_* (serveur de prod).
      # S'ils manquent, l'étape échoue au lieu de déployer ailleurs.
      - name: Deploy on test server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.TEST_VPS_HOST }}
          username: ${{ secrets.TEST_VPS_USER }}
          key: ${{ secrets.TEST_VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/restauranthandler/back-end
            docker pull mahdimcheik/restauranthandler:test
            docker compose up -d --force-recreate

      # - name: Check the deployed version
